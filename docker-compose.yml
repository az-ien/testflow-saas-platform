version: '3.9'

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: testflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: testflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    container_name: testflow_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./backend/logs:/app/logs

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: testflow_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ─── Test Executor Worker ────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: ./workers/test-executor/Dockerfile
    container_name: testflow_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      WORKER_CONCURRENCY: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /tmp:/tmp  # workspace for cloned repos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ─── AI QE Worker ────────────────────────────────────────────────────────────
  ai-worker:
    build:
      context: .
      dockerfile: ./workers/ai-worker/Dockerfile
    container_name: testflow_ai_worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      AI_WORKER_CONCURRENCY: 2
      ARTIFACT_DIR: /tmp/testflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_artifacts:/tmp/testflow-artifacts
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ─── Debug Tools (optional — comment out in production) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: testflow_pgadmin
    profiles: ["debug"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@testflow.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: testflow_redis_commander
    profiles: ["debug"]
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  mailhog:
    image: mailhog/mailhog:latest
    container_name: testflow_mailhog
    profiles: ["debug"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
  redis_data:
  ai_artifacts:

networks:
  default:
    name: testflow_network
